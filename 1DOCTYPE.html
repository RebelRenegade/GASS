<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction</title>

```
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        background: #111;
        color: #fff;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .container {
        padding: 40px 20px;
        max-width: 600px;
    }

    .icon {
        font-size: 70px;
        margin-bottom: 20px;
    }

    h1 {
        font-size: 42px;
        margin-bottom: 15px;
    }

    p {
        font-size: 18px;
        color: #bbb;
        line-height: 1.6;
    }

    .bar {
        width: 100%;
        height: 8px;
        background: #333;
        border-radius: 10px;
        margin: 30px 0;
        overflow: hidden;
    }

    .progress {
        width: 65%;
        height: 100%;
        background: #f5c542;
        border-radius: 10px;
    }

    .footer {
        margin-top: 30px;
        font-size: 14px;
        color: #777;
    }
</style>
```

</head>

<body>

```
<div class="container">
    <div class="icon">🚧</div>

    <h1>Under Construction</h1>

    <p>
        We're working on something new.
        <br>
        Check back soon!
    </p>

    <div class="bar">
        <div class="progress"></div>
    </div>

    <div class="footer">
        © 2026 Your Website
    </div>
</div>
```

</body>
</html>
